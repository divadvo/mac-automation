- name: Verify GitHub CLI authentication status
  command: gh auth status
  register: gh_auth_check
  failed_when: gh_auth_check.rc != 0
  changed_when: false

- name: Create main projects directory
  file:
    path: "{{ projects_dir }}"
    state: directory
    mode: '0755'
  become: false

- name: Create repository directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ github_dir }}"
    - "{{ github_other_dir }}"
    - "{{ sandbox_dir }}"

# `creates` skips the clone when the checkout is already there, instead of
# running it and filtering the "already exists" failure back out afterwards.
# Same outcome, minus a red rc=1 per existing repo on every run — noise that
# trains you to skim past errors that turn out to matter.
- name: Clone priority repositories to {{ github_dir }}/
  command: gh repo clone {{ item }} {{ github_dir }}/{{ item.split('/')[1] }}
  args:
    creates: "{{ (github_dir + '/' + item.split('/')[1]) | expanduser }}"
  loop: "{{ priority_repos }}"

- name: Fetch all repositories pushed after {{ repos_pushed_after }}
  shell: gh repo list --limit 200 --json nameWithOwner,pushedAt,repositoryTopics --jq '.[] | select(.pushedAt > "{{ repos_pushed_after }}") | [.nameWithOwner, ([((.repositoryTopics // [])[].name)] | contains(["sandbox"]))] | @tsv'
  register: recent_repos_result

# Clone remaining recent repositories (excluding already cloned priority repos)
- name: Clone recent repositories by topic (excluding priority repos)
  command: gh repo clone {{ repo }} {{ destination }}/{{ repo.split('/')[1] }}
  args:
    creates: "{{ (destination + '/' + repo.split('/')[1]) | expanduser }}"
  loop: "{{ recent_repos_result.stdout_lines | default([]) }}"
  vars:
    repo: "{{ item.split('\t')[0] }}"
    destination: "{{ sandbox_dir if item.split('\t')[1] == 'true' else github_dir }}"
  when:
    - recent_repos_result is defined
    - recent_repos_result.stdout_lines is defined
    - repo not in priority_repos

- name: Show summary of cloned repositories
  debug:
    msg: |
      Repository cloning complete!
      
      Priority repositories cloned to {{ github_dir }}/; recently pushed repositories routed by topic.
      
      Directory structure:
      - {{ github_dir }}/ - Your personal repositories
      - {{ github_other_dir }}/ - External repositories (empty, ready for use)
      - {{ sandbox_dir }}/ - Repositories with the sandbox topic
      
      Check {{ projects_dir }}/ for all your development projects.
