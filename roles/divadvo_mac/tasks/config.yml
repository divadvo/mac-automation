- name: Create required dotfiles directories
  file:
    path: '~/.{{ item }}'
    state: directory
  loop:
  - config/git
  - config/fish
  - config/zellij
  - config/opencode
  - claude
  - claude/skills
  tags:
  - dotfiles

- name: Create symlinks for dotfiles configuration
  file:
    src: '{{ ansible_env.PWD }}/roles/divadvo_mac/files/dotfiles/{{ item }}'
    path: '~/.{{ item }}'
    state: link
    force: yes # Remove file first, in case it exists
  loop:
  - config/ripgreprc
  - config/git/attributes
  - config/git/ignore
  - config/fish/config.fish
  - config/zellij/config.kdl
  - config/opencode/opencode.jsonc
  - ssh/config
  - zprofile
  - claude/settings.json
  - claude/statusline.sh
  - hushlogin
  - zshrc
  - tmux.conf
  tags:
  - dotfiles

- name: Create symlink for VSCode settings
  file:
    src: '{{ ansible_env.PWD }}/roles/divadvo_mac/files/dotfiles/config/vscode/settings.json'
    path: '{{ ansible_env.HOME }}/Library/Application Support/Code/User/settings.json'
    state: link
    force: yes
  tags:
  - dotfiles

- name: Set IINA as default video player
  command: duti -s com.colliderli.iina {{ item }} all
  loop:
  - mkv
  - mp4
  - m4v
  - mov
  - avi
  - webm
  - flv
  - wmv
  - mpg
  - mpeg
  - ts
  - m2ts
  changed_when: false
  tags:
  - iina

- name: Template git configuration file
  template:
    src: config/git/config.j2
    dest: ~/.config/git/config
    backup: yes
  tags:
  - dotfiles

# Download Catppuccin Frappé color scheme for iTerm2
- name: Create iTerm2 color schemes directory
  file:
    path: "{{ playbook_dir }}/downloads/iTerm2-Colors"
    state: directory
  tags:
  - iterm

- name: Download Catppuccin Frappé iTerm2 color scheme
  get_url:
    url: https://raw.githubusercontent.com/catppuccin/iterm/main/colors/catppuccin-frappe.itermcolors
    dest: "{{ playbook_dir }}/downloads/iTerm2-Colors/catppuccin-frappe.itermcolors"
    mode: '0644'
  tags:
  - iterm

