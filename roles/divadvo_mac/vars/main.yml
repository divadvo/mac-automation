# Runtime version configuration
node_version: "24"
ruby_version: "4"
bun_version: "1"
rust_version: "1"
python_versions:
  - "3.13"
  - "3.14"
postgresql_version: "18"

# Python tools to install via uv tool install
uv_tools:
- name: build
- name: ruff

# Oh My Zsh custom plugins
ohmyzsh_custom_plugins:
  - { name: zsh-autosuggestions, repo: "https://github.com/zsh-users/zsh-autosuggestions.git" }
  - { name: zsh-you-should-use, repo: "https://github.com/MichaelAquilina/zsh-you-should-use.git" }
  - { name: pnpm, repo: "https://github.com/ntnyq/omz-plugin-pnpm.git" }

# Claude Code extensions — installed user-wide (available in every repo).
# See roles/divadvo_mac/tasks/claude.yml. Keep in sync with ubuntu-setup.sh.
#
# MCP servers. HTTP servers set `url:`; stdio servers set `command:` (argv list).
claude_mcp_servers:
  - { name: context7, transport: http, url: "https://mcp.context7.com/mcp" }
  - { name: turbostarter, transport: http, url: "https://www.turbostarter.dev/mcp" }
  - { name: playwright, transport: stdio, command: ["npx", "-y", "@playwright/mcp@latest"] }
  - { name: chrome-devtools, transport: stdio, command: ["npx", "-y", "chrome-devtools-mcp@latest"] }
  - { name: shadcn, transport: stdio, command: ["npx", "-y", "shadcn@latest", "mcp"] }

# Plugins installed from marketplaces. `source` is the marketplace to register
# (github repo / url); `marketplace` is its declared name for the install id.
claude_plugins:
  - { name: cloudflare, marketplace: cloudflare, source: "cloudflare/skills" }
  - { name: caveman, marketplace: caveman, source: "juliusbrussee/caveman" }
  - { name: ponytail, marketplace: ponytail, source: "DietrichGebert/ponytail" }

# Global npm CLIs related to the Claude workflow (installed via mise's node/npm).
claude_global_npm_tools:
  - "@fission-ai/openspec@latest"

# User Configuration - Override these in local.yml (gitignored)
# The bootstrap script creates local.yml automatically
user_email: "your@email.com"
user_name: "Your Name"

# Directory structure for projects and repositories
projects_dir: "~/pr"
github_dir: "~/pr/github"
github_other_dir: "~/pr/github-other"
sandbox_dir: "~/pr/sandbox"

# Repository configuration
# Repositories that are always cloned to priority directory (format: "owner/repo")
priority_repos:
  - "divadvo/divadvo-scripts"
  # Add your important repositories here

# Clone all personal repositories pushed after this date
repos_pushed_after: "2022-01-01"

# Set to true to install only essential casks for faster testing
testing_mode: false

# Mobile remote access (all inbound-access changes are opt-in).
remote_access_enabled: false
sshid_handle: ""
ssh_key_only_auth: false
remote_access_allowed_users:
  - "{{ ansible_user_id }}"
remote_access_configure_firewall: false
